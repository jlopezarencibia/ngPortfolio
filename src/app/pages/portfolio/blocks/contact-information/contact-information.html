<app-card [dropShadow]="true">
  <div class="h5 mb-4">
    Contact Information
  </div>
  <div class="mb-3">
    <fa-icon [icon]="faLocationPin" class="me-3"></fa-icon>
    <span>{{ location }}</span>
  </div>
  <div>
    <fa-icon [icon]="faPhone" class="me-3"></fa-icon>
    <span>{{ phoneNumber }}</span>
  </div>
  <div>
    <fa-icon [icon]="faEnvelope" class="me-3"></fa-icon>
    <span>{{ emailAddress }}</span>
  </div>
  <div class="mt-3">
    <fa-icon [icon]="faLink"></fa-icon>
  </div>
  <div class="mt-4">
    <div class="row">
      <div class="col-6">
        <a class="btn app-btn-green w-100" [href]="'tel:' + phoneNumber">
          <fa-icon [icon]="faPhone" class="me-3"></fa-icon>
          Call</a>
      </div>
      <div class="col-6">
        <a class="btn app-btn-blue w-100" [href]="'mailto:' + emailAddress">
          <fa-icon [icon]="faEnvelope" class="me-3"></fa-icon>
          Email</a>
      </div>
    </div>
  </div>
</app-card>
